[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dialectic-crew-ai"
version = "1.0.0"
description = "Sistema de geração automática de PRD usando dialética socrática/hegeliana com CrewAI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
authors = [{ name = "Camilo" }]
keywords = ["crewai", "prd", "dialectic", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "crewai[tools,litellm]>=1.10.0",
    "crewai-tools>=1.10.0",
    "pydantic>=2.10.0",
    "python-dotenv",
]

[project.optional-dependencies]
dev = []

[project.scripts]
dialectic-crew = "main.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["schemas"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
