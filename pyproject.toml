[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dialectic-crew-ai"
version = "1.0.0"
description = "Sistema de geração automática de PRD usando dialética socrática/hegeliana com CrewAI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
authors = [{ name = "Camilo" }]
keywords = ["crewai", "prd", "dialectic", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "crewai[tools,litellm,file-processing]>=1.10.0",
    "crewai-tools[mcp]>=1.10.0",
    "mcp",
    "pydantic>=2.10.0",
    "PyYAML>=6.0",
    "tiktoken>=0.7.0",
    "python-dotenv",
    "reportlab>=4.0.0",
    "rich>=13.9.0",
    "typer>=0.12.5",
]

[project.optional-dependencies]
dev = []

[project.scripts]
dialectic-crew = "main.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov",
    "pytest-rerunfailures>=15.1",
    "pytest-timeout",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["schemas"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dialectic" = ["config/*.yaml"]
"planning" = ["config/*.yaml"]
"execution" = ["config/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = [
    "--ignore=src/mcp/skills/testing-patterns/scripts/test_runner.py",
]
markers = [
    "llm: tests that call real LLM APIs (require API keys, slow, costly)",
]
timeout = 300

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
exclude = [
    '^src/mcp/skills/.*/scripts/',
]

[[tool.mypy.overrides]]
module = ["schemas"]
ignore_missing_imports = true
