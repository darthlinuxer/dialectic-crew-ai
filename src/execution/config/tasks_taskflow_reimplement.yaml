reimplement_task_fix:
  description: |
    Task {task_id} — {task_title} was implemented but verification failed.

    Consult the system's anti-drift file {vision_file_ref} at exact path `{vision_path}`.
    Treat the knowledge-source content for `{vision_path}` as authoritative.

    TASK DESCRIPTION:
    {task_description}

    FAILED CHECKS:
    {failed_checks}

    VERIFICATION NOTES:
    {verification_notes}

    PRIOR DIALECTIC CONTEXT:
    {dialectic_context}

    Diagnose the root cause behind the failed checks before editing.
    If the issue is really about imports, references, tests, or package exports,
    fix those integration gaps instead of patching only the symptom.
    Fix ONLY the identified gaps.

    RESPONSE FORMAT RULES:
    {file_section_rules}
  expected_output: Root-cause summary plus complete file sections when files must change
  guardrail: text_result

reimplement_task_validate:
  description: |
    Evaluate whether the fix for task {task_id} resolved the issues.

    Consult the system's anti-drift file {vision_file_ref} at exact path `{vision_path}`.
    Treat the knowledge-source content for `{vision_path}` as authoritative.

    Minimum score: {min_score}
    Verify alignment with the macro vision.
    Confirm the fix addressed the root cause and did not leave import/reference/
    test/export inconsistencies behind.
  expected_output: ValidationOutput
  output_schema: ValidationOutput
  guardrail: quality
  guardrail_max_retries: 2