execute_task_thesis:
  description: |
    {tese_input}
  expected_output: "{plain_text_implementation_expected_output}"
  agent: implementer
  guardrail: text_result

execute_task_antithesis:
  description: |
    Analyze the implementation of task {task_id} — {task_title}.

    {final_text_response_rules}

    Consult the system's anti-drift file {vision_file_ref} at exact path `{vision_path}`.
    Treat the knowledge-source content for `{vision_path}` as authoritative.

    SCOPE: Evaluate ONLY whether it meets the description: """{task_description}"""
    Do NOT critique outside the scope. Do NOT request additional features.
    Check for contradictions with the macro vision.
    Also critique integration quality on the touched surface:
    - imports, references, and package/module boundaries
    - related tests or supporting files that should have been updated
    - obvious static-analysis or editor breakage left behind in adjacent files
  expected_output: "{plain_text_critique_expected_output}"
  agent: critico_socratico
  guardrail: text_result

execute_task_synthesis:
  description: |
    Produce the SYNTHESIS for task {task_id}: incorporate ALL critiques.

    {final_text_response_rules}

    Consult the system's anti-drift file {vision_file_ref} at exact path `{vision_path}`.
    Treat the knowledge-source content for `{vision_path}` as authoritative.
    Ensure the synthesis is aligned with the macro vision.
    Include clear instructions for retry if necessary.
    The refined solution must preserve integration quality for imports, references,
    tests, and supporting files on the touched surface.
  expected_output: "{plain_text_synthesis_expected_output}"
  agent: sintetizador
  guardrail: text_result

execute_task_validation:
  description: |
    Evaluate the implementation of task {task_id}.

    Consult the system's anti-drift file {vision_file_ref} at exact path `{vision_path}`.
    Treat the knowledge-source content for `{vision_path}` as authoritative.

    Minimum score for approval: {min_score}
    Verify alignment with the macro vision.
    The task is not approved unless the touched surface integrates cleanly:
    - imports, references, and package/module boundaries remain coherent
    - related tests or supporting files were updated when required
    - no obvious static-analysis or editor breakage is left behind in adjacent files
  expected_output: ValidationOutput
  agent: validador_macro
  output_schema: ValidationOutput
  guardrail: quality
  guardrail_max_retries: 2