verify_task_flow_implementation:
  description: |
    Verify whether task {task_id} — {task_title} was implemented.

    TASK DESCRIPTION:
    {task_description}

    Use the file reading tool to verify whether the artifacts exist.
    For each check, verify whether the file/function/config actually exists.{acceptance_checks_block}

    Also verify integration quality on the touched surface:
    - imports and references still resolve coherently
    - related tests or package exports/supporting files were updated when required
    - there is no obvious static-analysis breakage or editor-visible inconsistency left behind

    Fill in:
    - verified: true if ALL essential artifacts exist and the touched surface still integrates cleanly
    - checks_passed: list of checks that passed
    - checks_failed: list of checks that failed
    - notes: explanation of what was verified
    
    RESPONSE FORMAT RULES:
    {verification_response_rules}
  expected_output: VerificationResult
  output_schema: VerificationResult
  guardrail: verification
  guardrail_max_retries: 2